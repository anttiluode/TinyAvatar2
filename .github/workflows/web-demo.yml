name: Browser demo

on:
  pull_request:
  push:
    branches: [main, no-skeleton-web-toy]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: browser-demo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect generated assets
        id: assets
        shell: bash
        run: |
          if test -f web/tinyavatar.onnx && test -f web/controls.bin && test -f web/poster.png; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install export dependencies
        if: steps.assets.outputs.missing == 'true'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy onnx
      - name: Generate browser model
        if: steps.assets.outputs.missing == 'true'
        run: python tools/export_web_demo.py --checkpoint model2.pt --out web --seeds 1,7,8,12
      - name: Check browser assets
        run: |
          node --check web/app.js
          python tools/check_web_demo.py
      - name: Commit generated browser model
        if: github.event_name == 'push' && github.ref == 'refs/heads/no-skeleton-web-toy' && steps.assets.outputs.missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/controls.bin web/controls.json web/poster.png web/tinyavatar.onnx
          git commit -m "Generate browser model assets"
          git push

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
